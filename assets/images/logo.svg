<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 56" width="340" height="56" fill="none">
  <defs>
    <!-- Deep Emerald Shield Gradient -->
    <linearGradient id="rgaShieldLight" x1="2" y1="2" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="60%" stop-color="#0F4726"/>
      <stop offset="100%" stop-color="#062E18"/>
    </linearGradient>

    <!-- Fresh Botanical Leaf Gradient -->
    <linearGradient id="rgaLeafLight" x1="12" y1="10" x2="40" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BEF264"/>
      <stop offset="50%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <!-- Dynamic 'Go Away' Exit Arc Gradient -->
    <linearGradient id="rgaArcLight" x1="8" y1="38" x2="48" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>

    <filter id="rgaShadowLight" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#062E18" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Modern Rounded Shield Badge (52x52) -->
  <g filter="url(#rgaShadowLight)">
    <rect x="2" y="2" width="52" height="52" rx="15" fill="url(#rgaShieldLight)"/>
    <rect x="2.75" y="2.75" width="50.5" height="50.5" rx="14.25" stroke="#86EFAC" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <!-- Botanical Leaf Shield (Herbal Eco Protection) -->
  <path d="M28 10C17.5 13.5 14 24.5 17 35C20.5 32 25 26.5 28 18C31 26.5 35.5 32 39 35C42 24.5 38.5 13.5 28 10Z" fill="url(#rgaLeafLight)" fill-opacity="0.25"/>
  <path d="M17 37C15.5 25.5 22.5 15.5 36.5 13C37.5 25.5 30.5 36 17 37Z" fill="url(#rgaLeafLight)"/>
  <path d="M17 37C24.5 30 29.5 23 36.5 13C30 35.5 23 37.5 17 37Z" fill="#064E3B" fill-opacity="0.45"/>
  <path d="M16 38.5C21.5 33 28.5 25.5 35 15" stroke="#F7FEE7" stroke-width="2" stroke-linecap="round"/>

  <!-- Dynamic 'Go Away' Sweep Arc & Exit Arrow -->
  <path d="M11 41C18 44 28 43 37 36C43 31 46 23 46 15" stroke="url(#rgaArcLight)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="38 7"/>
  <path d="M41 14.5L46.5 14.5L45.5 20" stroke="#FACC15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nano Particles -->
  <circle cx="42" cy="37" r="2" fill="#BEF264"/>
  <circle cx="11.5" cy="33" r="1.8" fill="#86EFAC"/>

  <!-- Brand Typography: RAT GO AWAY -->
  <g font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="65" y="27" font-size="24" font-weight="900" letter-spacing="0.02em">
      <tspan fill="#062E18">RAT</tspan> <tspan fill="#15803D">GO</tspan> <tspan fill="#10B981">AWAY</tspan>
    </text>

    <!-- Pill Tagline Badge -->
    <rect x="65" y="34.5" width="215" height="17" rx="8.5" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1"/>
    <circle cx="74.5" cy="43" r="3.2" fill="#15803D"/>
    <text x="83" y="47" font-family="'Prompt', -apple-system, sans-serif" font-size="9.6" font-weight="700" letter-spacing="0.03em" fill="#14532D">
      สมุนไพรนาโนไล่หนู • ปลอดภัย 100%
    </text>
  </g>
</svg>
