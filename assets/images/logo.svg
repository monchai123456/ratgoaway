<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 56" width="340" height="56" fill="none">
  <defs>
    <!-- Deep Emerald Gradient -->
    <linearGradient id="shieldGradMd" x1="2" y1="2" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B6F43"/>
      <stop offset="100%" stop-color="#0F381E"/>
    </linearGradient>
    <!-- Fresh Lime Botanical Gradient -->
    <linearGradient id="leafGradMd" x1="12" y1="10" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BEF264"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
    <!-- Subtle Nano Orbit Gradient -->
    <linearGradient id="orbitGradMd" x1="6" y1="8" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softGlowMd" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0F381E" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Modern Squircle Shield Emblem (52x52) -->
  <g filter="url(#softGlowMd)">
    <rect x="2" y="2" width="52" height="52" rx="15" fill="url(#shieldGradMd)"/>
    <rect x="2.75" y="2.75" width="50.5" height="50.5" rx="14.25" stroke="#A3E635" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <!-- Nano-Tech Orbit Ring -->
  <ellipse cx="28" cy="28" rx="20" ry="11.5" transform="rotate(-32 28 28)" stroke="url(#orbitGradMd)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="75 18"/>
  
  <!-- Nano Nodes -->
  <circle cx="12.5" cy="37" r="2.5" fill="#BEF264"/>
  <circle cx="43.5" cy="18.5" r="2.2" fill="#6EE7B7"/>

  <!-- Botanical Leaf Background Shadow -->
  <path d="M28 10C17.5 14 14.5 25 17.5 35C20.5 32.5 25 27 28 19C31 27 35.5 32.5 38.5 35C41.5 25 38.5 14 28 10Z" fill="url(#leafGradMd)" opacity="0.24"/>
  
  <!-- Crisp Dual-Tone Modern Leaf -->
  <path d="M18 37C16.5 26 23 15.5 37 13C38 25.5 31 36 18 37Z" fill="url(#leafGradMd)"/>
  <path d="M18 37C25 30 30 23.5 37 13C31 36 24 37.5 18 37Z" fill="#14532D" fill-opacity="0.48"/>
  
  <!-- Leaf Stem / Vein -->
  <path d="M17 38.5C22.5 33 29 25.5 35.5 15" stroke="#F7FEE7" stroke-width="2" stroke-linecap="round"/>

  <!-- Brand Typography - Fits perfectly within viewBox -->
  <g font-family="'Plus Jakarta Sans', 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- RAT TERMINATOR -->
    <text x="64" y="28" font-size="22.5" font-weight="900" letter-spacing="0.02em" fill="#0A2417">
      RAT <tspan fill="#166534">TERMINATOR</tspan>
    </text>
    
    <!-- Tagline Badge Pill (Clean & Fits inside width) -->
    <rect x="64" y="34.5" width="268" height="17" rx="8.5" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1"/>
    <circle cx="74" cy="43" r="3.2" fill="#15803D"/>
    <text x="83" y="47" font-size="9.8" font-weight="700" letter-spacing="0.04em" fill="#14532D">
      สมุนไพรนาโนกำจัดหนู • ปลอดสารพิษ 100%
    </text>
  </g>
</svg>
