<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#E2F8F3"/>
    </linearGradient>
    <linearGradient id="headerBar" x1="120" y1="60" x2="680" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="waxCube3Top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="waxCube3Left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="waxCube3Right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="boxShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F4C45" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad3)"/>

  <!-- Main White Container Card -->
  <g filter="url(#boxShadow3)">
    <rect x="44" y="44" width="712" height="712" rx="36" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/>
  </g>

  <!-- Top Header Banner -->
  <path d="M44 80 C44 60, 60 44, 80 44 L720 44 C740 44, 756 60, 756 80 L756 156 L44 156 Z" fill="url(#headerBar)"/>
  <text x="400" y="96" text-anchor="middle" font-family="'Prompt', 'Plus Jakarta Sans', sans-serif" font-size="27" font-weight="800" fill="#FFFFFF">
    จุดวางแนะนำ &amp; วิธีใช้ Bye Bye Rat
  </text>
  <text x="400" y="130" text-anchor="middle" font-family="'Prompt', sans-serif" font-size="16" font-weight="500" fill="#CCFBF1">
    วางในบริเวณที่หนูรบกวน ทนแดด ทนฝน ใช้งานได้ทั้งในร่มและกลางแจ้ง
  </text>

  <!-- 4 Placement Zones Grid -->
  <!-- Zone 1: บนฝ้าเพดาน -->
  <g transform="translate(82, 188)">
    <rect width="302" height="162" rx="22" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1.5"/>
    <circle cx="48" cy="52" r="26" fill="#0D9488"/>
    <text x="48" y="61" text-anchor="middle" font-size="24">🏠</text>
    <text x="90" y="46" font-family="'Prompt', sans-serif" font-size="19" font-weight="700" fill="#0F766E">1. บนฝ้าเพดาน / ช่องชาร์ป</text>
    <text x="90" y="72" font-family="'Prompt', sans-serif" font-size="14" fill="#475569">จุดซ่อนตัวและทางวิ่งหลักของหนู</text>
    <text x="26" y="112" font-family="'Prompt', sans-serif" font-size="14.5" fill="#1E293B">• โยนหรือวางก้อนไล่หนูไว้เหนือฝ้า</text>
    <text x="26" y="138" font-family="'Prompt', sans-serif" font-size="14.5" fill="#1E293B">• ลดเสียงหนูวิ่งรบกวนตอนกลางคืน</text>
  </g>

  <!-- Zone 2: ห้องครัว & ตู้เก็บอาหาร -->
  <g transform="translate(416, 188)">
    <rect width="302" height="162" rx="22" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1.5"/>
    <circle cx="48" cy="52" r="26" fill="#0D9488"/>
    <text x="48" y="61" text-anchor="middle" font-size="24">🍽️</text>
    <text x="90" y="46" font-family="'Prompt', sans-serif" font-size="19" font-weight="700" fill="#0F766E">2. ห้องครัว / ใต้ซิงค์ล้างจาน</text>
    <text x="90" y="72" font-family="'Prompt', sans-serif" font-size="14" fill="#475569">ป้องกันหนูมาคุ้ยหาเศษอาหาร</text>
    <text x="26" y="112" font-family="'Prompt', sans-serif" font-size="14.5" fill="#1E293B">• ปลอดสารพิษ ไม่มีสารเคมีตกค้าง</text>
    <text x="26" y="138" font-family="'Prompt', sans-serif" font-size="14.5" fill="#1E293B">• ลดกลิ่นฉี่และขี้หนูในพื้นที่เตรียมอาหาร</text>
  </g>

  <!-- Zone 3: ห้องเก็บของ & ตู้ไฟ -->
  <g transform="translate(82, 376)">
    <rect width="302" height="162" rx="22" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1.5"/>
    <circle cx="48" cy="52" r="26" fill="#0D9488"/>
    <text x="48" y="61" text-anchor="middle" font-size="24">📦</text>
    <text x="90" y="46" font-family="'Prompt', sans-serif" font-size="19" font-weight="700" fill="#0F766E">3. ห้องเก็บของ / หลังตู้เย็น</text>
    <text x="90" y="72" font-family="'Prompt', sans-serif" font-size="14" fill="#475569">ป้องกันหนูกัดแทะสายไฟและสิ่งของ</text>
    <text x="26" y="112" font-family="'Prompt', sans-serif" font-size="14.5" fill="#1E293B">• วางตามมุมอับ ซอกตู้ หรือใกล้สายไฟ</text>
    <text x="26" y="138" font-family="'Prompt', sans-serif" font-size="14.5" fill="#1E293B">• ป้องกันเครื่องใช้ไฟฟ้าเสียหาย</text>
  </g>

  <!-- Zone 4: โรงรถ & รอบบ้านกลางแจ้ง -->
  <g transform="translate(416, 376)">
    <rect width="302" height="162" rx="22" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1.5"/>
    <circle cx="48" cy="52" r="26" fill="#0D9488"/>
    <text x="48" y="61" text-anchor="middle" font-size="24">🚗</text>
    <text x="90" y="46" font-family="'Prompt', sans-serif" font-size="19" font-weight="700" fill="#0F766E">4. โรงรถ / พื้นที่กลางแจ้ง</text>
    <text x="90" y="72" font-family="'Prompt', sans-serif" font-size="14" fill="#475569">ทนแดด ทนฝน ไม่ละลายน้ำง่าย</text>
    <text x="26" y="112" font-family="'Prompt', sans-serif" font-size="14.5" fill="#1E293B">• วางใกล้ถังขยะ ทางเดินรอบบ้าน</text>
    <text x="26" y="138" font-family="'Prompt', sans-serif" font-size="14.5" fill="#1E293B">• หากพื้นที่ใหญ่ ควรวางกระจายหลายก้อน</text>
  </g>

  <!-- Bottom Usage Steps Strip -->
  <rect x="82" y="568" width="636" height="146" rx="24" fill="#132A1E"/>
  <g transform="translate(106, 595)">
    <path d="M35 4L66 22L35 40L4 22L35 4Z" fill="url(#waxCube3Top)"/>
    <path d="M4 22L35 40V76L4 58V22Z" fill="url(#waxCube3Left)"/>
    <path d="M66 22L35 40V76L66 58V22Z" fill="url(#waxCube3Right)"/>
  </g>
  <text x="200" y="615" font-family="'Prompt', sans-serif" font-size="18.5" font-weight="700" fill="#A3E635">
    💡 คำแนะนำการใช้งานเพื่อประสิทธิภาพสูงสุด
  </text>
  <text x="200" y="646" font-family="'Prompt', sans-serif" font-size="15" fill="#FFFFFF">
    • 1 ก้อน ครอบคลุมพื้นที่ประมาณ 3 ตารางเมตร • เปลี่ยนก้อนใหม่เมื่อกลิ่นเริ่มจางลง
  </text>
  <text x="200" y="674" font-family="'Prompt', sans-serif" font-size="15" fill="#A7F3D0">
    • เปิดซองแล้วใช้ไม่หมด ให้ปิดซองเก็บในที่แห้งมิดชิด • ล้างมือให้สะอาดหลังหยิบจับทุกครั้ง
  </text>
</svg>
