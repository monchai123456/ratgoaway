<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <!-- 3D Cube Gradients -->
    <linearGradient id="cubeTop" x1="24" y1="16" x2="56" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="18" y1="26" x2="40" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="40" y1="26" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="mintLeaf" x1="46" y1="42" x2="68" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="cubeGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F766E" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Outer Soft Rounded Square -->
  <rect x="4" y="4" width="72" height="72" rx="20" fill="#F0FDFA"/>
  <rect x="4.75" y="4.75" width="70.5" height="70.5" rx="19.25" stroke="#99F6E4" stroke-width="1.5"/>

  <!-- Repelling Aura Waves -->
  <path d="M16 25C19 19 25 14 32 13" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"/>
  <circle cx="60" cy="20" r="2.5" fill="#2DD4BF"/>
  <circle cx="15" cy="48" r="2" fill="#5EEAD4"/>

  <!-- 3D Isometric Paraffin Wax Cube -->
  <g filter="url(#cubeGlow)">
    <!-- Top Face -->
    <path d="M38 15L60 27.5L38 40L16 27.5L38 15Z" fill="url(#cubeTop)"/>
    <!-- Left Face -->
    <path d="M16 27.5L38 40V64L16 51.5V27.5Z" fill="url(#cubeLeft)"/>
    <!-- Right Face -->
    <path d="M60 27.5L38 40V64L60 51.5V27.5Z" fill="url(#cubeRight)"/>
    <!-- Highlight Edges -->
    <path d="M16 27.5L38 40L60 27.5" stroke="#CCFBF1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 40V64" stroke="#99F6E4" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Fresh Peppermint Leaf Emblem -->
  <path d="M46 64C45 53 52 44 66 42C67 54 59 63 46 64Z" fill="url(#mintLeaf)" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M46 64C51.5 58.5 57 52.5 63.5 44.5" stroke="#ECFCCB" stroke-width="2" stroke-linecap="round"/>
</svg>
