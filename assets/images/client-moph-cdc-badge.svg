<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 54" width="280" height="54" fill="none">
  <!-- MOPH Seal Emblem (Left) -->
  <g transform="translate(6, 4)">
    <circle cx="23" cy="23" r="21" fill="#F0FDF4" stroke="#059669" stroke-width="2"/>
    <circle cx="23" cy="23" r="16" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="2 2"/>
    <!-- Medical Rod & Serpent Symbol -->
    <line x1="23" y1="12" x2="23" y2="34" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18 16 C 28 18, 28 22, 18 24 C 28 26, 28 30, 18 32" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <circle cx="23" cy="11" r="2.5" fill="#047857"/>
  </g>

  <!-- Center Text -->
  <g transform="translate(62, 0)">
    <text x="75" y="22" font-family="'Plus Jakarta Sans', 'Prompt', sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="0.3">Thailand MOPH – U.S. CDC</text>
    <text x="75" y="36" font-family="'Prompt', sans-serif" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">ศูนย์ความร่วมมือกระทรวงสาธารณสุข</text>
    <text x="75" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="0.5">PUBLIC HEALTH COLLABORATION</text>
  </g>

  <!-- U.S. CDC Shield (Right) -->
  <g transform="translate(224, 6)">
    <rect x="0" y="0" width="46" height="42" rx="6" fill="#003865"/>
    <text x="23" y="22" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CDC</text>
    <rect x="6" y="27" width="34" height="1.5" fill="#38BDF8"/>
    <text x="23" y="37" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="0.5">U.S.A.</text>
  </g>
</svg>
