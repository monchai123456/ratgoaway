<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4FAF7"/>
      <stop offset="100%" stop-color="#E8F6F0"/>
    </linearGradient>
    <linearGradient id="waxTop2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="waxLeft2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="waxRight2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="cardDrop" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F4C45" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgGrad2)"/>

  <!-- Scent Waves -->
  <circle cx="400" cy="400" r="150" stroke="#2E7D4F" stroke-opacity="0.4" stroke-width="2.5" stroke-dasharray="8 8"/>
  <circle cx="400" cy="400" r="220" stroke="#2E7D4F" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="12 10"/>
  <circle cx="400" cy="400" r="290" stroke="#2E7D4F" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Header Title -->
  <text x="400" y="80" text-anchor="middle" font-family="'Prompt', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#143520">
    กลไกการออกฤทธิ์ของ <tspan fill="#2E7D4F">Bye Bye Rat</tspan>
  </text>
  <text x="400" y="114" text-anchor="middle" font-family="'Prompt', sans-serif" font-size="16.5" font-weight="500" fill="#4E6356">
    ผสาน 2 พลังธรรมชาติ ป้องกันและขับไล่หนูโดยไม่ใช้สารเคมีอันตราย
  </text>

  <!-- Center Hero Cube -->
  <g filter="url(#cardDrop)">
    <circle cx="400" cy="400" r="110" fill="#FFFFFF" stroke="#C8E6C9" stroke-width="3"/>
    <g transform="translate(322, 314)">
      <path d="M78 10L146 48L78 86L10 48L78 10Z" fill="url(#waxTop2)"/>
      <path d="M10 48L78 86V162L10 124V48Z" fill="url(#waxLeft2)"/>
      <path d="M146 48L78 86V162L146 124V48Z" fill="url(#waxRight2)"/>
      <path d="M10 48L78 86L146 48" stroke="#E0F2FE" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M78 86V162" stroke="#99F6E4" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 4 Feature Cards Around Center -->
  <!-- Card 1: Top Left - Peppermint Oil -->
  <g filter="url(#cardDrop)" transform="translate(50, 160)">
    <rect width="280" height="150" rx="20" fill="#FFFFFF" stroke="#D1E7D8" stroke-width="1.5"/>
    <rect x="20" y="20" width="46" height="46" rx="14" fill="#E8F5E9"/>
    <!-- Leaf SVG -->
    <path d="M43 28C36 28 30 35 30 43C30 51 40 54 43 54C43 45 48 37 56 34C54 30 49 28 43 28Z" fill="#2E7D4F"/>
    <text x="78" y="42" font-family="'Plus Jakarta Sans', 'Prompt', sans-serif" font-size="18" font-weight="800" fill="#1B4D2E">Peppermint Oil</text>
    <text x="78" y="62" font-family="'Prompt', sans-serif" font-size="13.5" font-weight="600" fill="#526E5C">เปปเปอร์มิ้นท์สกัดเข้มข้น</text>
    <text x="20" y="98" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#23382B">• ส่งกลิ่นสมุนไพรที่หนูไม่ชอบ</text>
    <text x="20" y="122" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#23382B">• หนูหลีกเลี่ยงไม่อยากเข้าใกล้</text>
  </g>

  <!-- Card 2: Top Right - Paraffin Wax -->
  <g filter="url(#cardDrop)" transform="translate(470, 160)">
    <rect width="280" height="150" rx="20" fill="#FFFFFF" stroke="#D1E7D8" stroke-width="1.5"/>
    <rect x="20" y="20" width="46" height="46" rx="14" fill="#E0F2FE"/>
    <!-- Shield / Wax Cube SVG -->
    <path d="M43 28L32 34V46C32 53 43 58 43 58C43 58 54 53 54 46V34L43 28Z" fill="#0284C7"/>
    <text x="78" y="42" font-family="'Plus Jakarta Sans', 'Prompt', sans-serif" font-size="18" font-weight="800" fill="#0369A1">Paraffin Wax</text>
    <text x="78" y="62" font-family="'Prompt', sans-serif" font-size="13.5" font-weight="600" fill="#526E5C">แว็กซ์เนื้อแน่นคุณภาพสูง</text>
    <text x="20" y="98" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#23382B">• กักเก็บและกระจายกลิ่นยาวนาน</text>
    <text x="20" y="122" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#23382B">• ทนความร้อน ไม่ละลายง่าย</text>
  </g>

  <!-- Card 3: Bottom Left - All Weather -->
  <g filter="url(#cardDrop)" transform="translate(50, 500)">
    <rect width="280" height="150" rx="20" fill="#FFFFFF" stroke="#D1E7D8" stroke-width="1.5"/>
    <rect x="20" y="20" width="46" height="46" rx="14" fill="#FEF3C7"/>
    <!-- Sun / Weather SVG -->
    <circle cx="43" cy="43" r="8" fill="#D97706"/>
    <path d="M43 27V31M43 55V59M27 43H31M55 43H59M32 32L35 35M51 51L54 54M54 32L51 35M35 51L32 54" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
    <text x="78" y="42" font-family="'Prompt', sans-serif" font-size="18" font-weight="800" fill="#B45309">ทนแดด ทนฝน</text>
    <text x="78" y="62" font-family="'Prompt', sans-serif" font-size="13.5" font-weight="600" fill="#526E5C">ใช้งานได้ทุกสภาพอากาศ</text>
    <text x="20" y="98" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#23382B">• วางได้ทั้งในร่มและกลางแจ้ง</text>
    <text x="20" y="122" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#23382B">• ประสิทธิภาพคงที่ ทนทานสูง</text>
  </g>

  <!-- Card 4: Bottom Right - Hygiene & Safety -->
  <g filter="url(#cardDrop)" transform="translate(470, 500)">
    <rect width="280" height="150" rx="20" fill="#FFFFFF" stroke="#D1E7D8" stroke-width="1.5"/>
    <rect x="20" y="20" width="46" height="46" rx="14" fill="#E8F5E9"/>
    <!-- Sparkles / Hygiene SVG -->
    <path d="M43 28L45 36L53 38L45 40L43 48L41 40L33 38L41 36L43 28Z" fill="#15803D"/>
    <text x="78" y="42" font-family="'Prompt', sans-serif" font-size="18" font-weight="800" fill="#15803D">ลดมูลและเชื้อโรค</text>
    <text x="78" y="62" font-family="'Prompt', sans-serif" font-size="13.5" font-weight="600" fill="#526E5C">บ้านสะอาด ไร้คราบสิ่งสกปรก</text>
    <text x="20" y="98" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#23382B">• ลดการขับถ่ายของหนูในบ้าน</text>
    <text x="20" y="122" font-family="'Prompt', sans-serif" font-size="14" font-weight="600" fill="#23382B">• ปลอดภัยต่อเด็กและสัตว์เลี้ยง</text>
  </g>

  <!-- Bottom CTA badge -->
  <rect x="220" y="688" width="360" height="46" rx="23" fill="#143520"/>
  <text x="400" y="717" text-anchor="middle" font-family="'Prompt', sans-serif" font-size="15.5" font-weight="700" fill="#A3E635">
    ✨ 1 ซอง บรรจุ 8 ก้อน • ซองซิปล็อกเก็บกลิ่น
  </text>
</svg>