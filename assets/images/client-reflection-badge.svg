<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 52" width="250" height="52" fill="none">
  <!-- Twin Towers Luxury Icon (Left) -->
  <g transform="translate(10, 6)">
    <!-- Tower 1 -->
    <rect x="2" y="4" width="10" height="34" rx="2" fill="url(#towerGrad1)"/>
    <!-- Tower 2 (Taller) -->
    <rect x="15" y="0" width="10" height="38" rx="2" fill="url(#towerGrad2)"/>
    <!-- Windows slits -->
    <line x1="5" y1="9" x2="9" y2="9" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="5" y1="15" x2="9" y2="15" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="5" y1="21" x2="9" y2="21" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="18" y1="6" x2="22" y2="6" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="18" y1="12" x2="22" y2="12" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="18" y1="18" x2="22" y2="18" stroke="#FFFFFF" stroke-width="1.2"/>
    <!-- Water wave reflection -->
    <path d="M0 40 Q 14 38, 28 40" stroke="#0D9488" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Typography (Center-Right) -->
  <g transform="translate(48, 0)">
    <text x="96" y="22" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="15" font-weight="800" fill="#0F766E" text-anchor="middle" letter-spacing="3">REFLECTION</text>
    <text x="96" y="35" font-family="'Plus Jakarta Sans', 'Prompt', sans-serif" font-size="8.5" font-weight="700" fill="#D97706" text-anchor="middle" letter-spacing="1.5">JOMTIEN BEACH PATTAYA</text>
    <text x="96" y="46" font-family="'Prompt', sans-serif" font-size="7.5" font-weight="500" fill="#64748B" text-anchor="middle">ลักชัวรีคอนโดมิเนียมริมหาดจอมเทียน</text>
  </g>

  <defs>
    <linearGradient id="towerGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="towerGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
  </defs>
</svg>
